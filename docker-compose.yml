services:
  postgres:
    image: postgres:16-alpine
    container_name: dc_postgres
    environment:
      POSTGRES_USER: dc_user
      POSTGRES_PASSWORD: dc_password
      POSTGRES_DB: dc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
