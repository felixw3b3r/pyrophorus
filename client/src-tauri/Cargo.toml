[package]
name = "pyrophorus"
version = "0.1.0"
description = "Pyrophorus Encrypted Desktop Application"
authors = ["Pyrophorus Team"]
edition = "2021"

[lib]
name = "pyrophorus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vodozemac = "0.6"
base64 = "0.22"
cpal = "0.15"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
